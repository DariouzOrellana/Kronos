<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments.html :: head}"></head>
<body class="hold-transition sidebar-mini layout-fixed">
<div class="wrapper">
    <div th:replace="~{fragments.html :: menu}"></div>

    <div class="content-wrapper">
        <div class="content-header">
            <div class="container-fluid">
                <div class="row mb-2">
                    <div class="col-sm-6">
                        <h1 class="m-0" th:text="${title}">Sucursales</h1>
                    </div>
                </div>
            </div>
        </div>

        <section class="content">
            <div class="container-fluid">
                <div class="row">
                    <div class="col-12">
                        <div class="card mb-3">
                            <div class="card-body">
                                <div class="d-flex align-items-center">
                                    <div class="mr-auto"></div>
                                    <div class="mx-auto">
                                        <a th:href="@{/sucursales/crear}" class="btn btn-primary">
                                            <i class="fas fa-plus"></i> Nueva sucursal
                                        </a>
                                    </div>
                                    <div class="ml-auto"></div>
                                </div>
                            </div>
                        </div>

                        <div class="card">
                            <div class="card-header d-flex justify-content-between align-items-center">
                                <h3 class="card-title m-0">Listado de sucursales</h3>
                            </div>
                            <div class="card-body">
                                <div>
                                    <style>
                                        .btn-icon { padding: .2rem .35rem; line-height: 1; }
                                        .table td, .table th { vertical-align: middle; }
                                    </style>
                                    <table id="tablaSucursales" class="table table-bordered table-striped w-100 nowrap" style="width:100%">
                                        <thead>
                                        <tr>
                                            <th>Acciones</th>
                                            <th>ID</th>
                                            <th>Estado</th>
                                            <th>Establecimiento</th>
                                            <th>Nombre</th>
                                            <th>Empresa</th>
                                            <th>Teléfono</th>
                                            <th>Correo</th>
                                        </tr>
                                        </thead>
                                        <tbody>
                                        <tr th:each="s : ${sucursales}">
                                            <td>
                                                <a th:href="@{'/sucursales/' + ${s.id} + '/editar'}" class="btn btn-primary btn-icon" title="Editar" aria-label="Editar"><i class="fas fa-edit"></i></a>
                                                <!--<form th:action="@{'/sucursales/' + ${s.id} + '/eliminar'}" method="post" class="js-delete-form d-inline-block ml-1">
                                                    <button type="submit" class="btn btn-danger btn-icon" title="Eliminar" aria-label="Eliminar">
                                                        <i class="fas fa-trash"></i>
                                                    </button>
                                                </form>-->
                                            </td>
                                            <td th:text="${s.id}"></td>
                                            <td class="text-center">
                                                <span th:class="${s.estado} == 1 ? 'badge badge-success' : 'badge badge-secondary'"
                                                      th:text="${s.estado} == 1 ? 'Activo' : 'Inactivo'"></span>
                                            </td>
                                            <td th:text="${s.establecimientoMh}"></td>
                                            <td th:text="${s.nombreSucursal}"></td>
                                            <td th:text="${s.empresa != null ? s.empresa.nombreEmpresa : '—'}"></td>
                                            <td th:text="${s.telefono}"></td>
                                            <td th:text="${s.correo}"></td>
                                        </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </section>
    </div>

    <footer th:replace="~{fragments.html :: footer}"></footer>
</div>
<div th:replace="~{fragments.html :: scripts}"></div>
<script>
    document.addEventListener('DOMContentLoaded', function(){
        if (window.jQuery && $('#tablaSucursales').length) {
            // Forzar auto layout como en ver_ventas.html para mejor ajuste de anchos
            const style = document.createElement('style');
            style.textContent = 'table.dataTable{table-layout:auto !important;}';
            document.head.appendChild(style);

            const sel = '#tablaSucursales';
            const table = $.fn.dataTable.isDataTable(sel)
                ? $(sel).DataTable()
                : $(sel).DataTable({
                    pageLength: 10,
                    order: [ [1,'desc'] ],
                    scrollX: true,
                    autoWidth: true,
                    language: { url: 'https://cdn.datatables.net/plug-ins/1.13.4/i18n/es-ES.json' }
                });
            function safeAdjust(){
                try{ const c = table && table.table ? table.table().container() : null; if (c) { table.columns.adjust(); } }catch(e){}
            }
            setTimeout(safeAdjust, 0);
            window.addEventListener('resize', safeAdjust);
        }
        // Confirmación de eliminación con SweetAlert2
        $(document).on('submit', '.js-delete-form', function(e){
            e.preventDefault();
            const form = this;
            Swal.fire({
                title: '¿Eliminar sucursal?',
                text: 'Esta acción no se puede deshacer',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'Sí, eliminar',
                cancelButtonText: 'Cancelar'
            }).then((result) => {
                if (result.isConfirmed) {
                    form.submit();
                }
            });
        });
    });
</script>
</body>
</html>
