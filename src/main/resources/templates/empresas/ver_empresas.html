<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments.html :: head}"></head>
<body class="hold-transition sidebar-mini layout-fixed">
<div class="wrapper">
    <div th:replace="~{fragments.html :: menu}"></div>

    <div class="content-wrapper">
        <div class="content-header">
            <div class="container-fluid">
                <div class="row mb-2">
                    <div class="col-sm-6">
                        <h1 class="m-0" th:text="${title}">Empresas</h1>
                    </div>
                </div>
            </div>
        </div>

        <section class="content">
            <div class="container-fluid">
                <div class="row">
                    <div class="col-12">
                        <div class="card mb-3">
                            <div class="card-body">
                                <div class="d-flex align-items-center">
                                    <div class="mr-auto"></div>
                                    <div class="mx-auto">
                                        <a th:href="@{/empresas/crear}" class="btn btn-primary">
                                            <i class="fas fa-plus"></i> Nueva empresa
                                        </a>
                                    </div>
                                    <div class="ml-auto"></div>
                                </div>
                            </div>
                        </div>

                        <div class="card">
                            <div class="card-header d-flex justify-content-between align-items-center">
                                <h3 class="card-title m-0">Listado de empresas</h3>
                            </div>
                            <div class="card-body">
                                <div>
                                    <style>
                                        .btn-icon { padding: .2rem .35rem; line-height: 1; }
                                        .table td, .table th { vertical-align: middle; white-space: nowrap; }
                                    </style>
                                    <table id="tablaEmpresas" class="table table-bordered table-striped w-100 nowrap" style="width:100%">
                                        <thead>
                                        <tr>
                                            <th>Acciones</th>
                                            <th>ID</th>
                                            <th>Estado</th>
                                            <th>Nombre</th>
                                            <th>Nombre comercial</th>
                                            <th>NIT</th>
                                            <th>DUI</th>
                                            <th>NRC</th>
                                            <th>Teléfono</th>
                                            <th>Correo</th>
                                        </tr>
                                        </thead>
                                        <tbody>
                                        <tr th:each="e : ${empresas}">
                                            <td>
                                                <a th:href="@{'/empresas/' + ${e.id} + '/editar'}" class="btn btn-primary btn-icon" title="Editar" aria-label="Editar"><i class="fas fa-edit"></i></a>
                                                <form th:action="@{'/empresas/' + ${e.id} + '/eliminar'}" method="post" class="js-delete-form d-inline-block ml-1">
                                                    <button type="submit" class="btn btn-danger btn-icon" title="Eliminar" aria-label="Eliminar">
                                                        <i class="fas fa-trash"></i>
                                                    </button>
                                                </form>
                                            </td>
                                            <td th:text="${e.id}"></td>
                                            <td class="text-center">
                                                <span th:class="${e.estado} == 1 ? 'badge badge-success' : 'badge badge-secondary'"
                                                      th:text="${e.estado} == 1 ? 'Activo' : 'Inactivo'"></span>
                                            </td>
                                            <td th:text="${e.nombreEmpresa}"></td>
                                            <td th:text="${e.nombreComercial}"></td>
                                            <td th:text="${e.nit}"></td>
                                            <td th:text="${e.dui}"></td>
                                            <td th:text="${e.noRegistro}"></td>
                                            <td th:text="${e.telefono}"></td>
                                            <td th:text="${e.correo}"></td>
                                        </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </section>
    </div>

    <footer th:replace="~{fragments.html :: footer}"></footer>
</div>
<div th:replace="~{fragments.html :: scripts}"></div>
<script>
    document.addEventListener('DOMContentLoaded', function(){
        if (window.jQuery && $('#tablaEmpresas').length) {
            // Forzar auto layout como en ver_ventas.html para mejor ajuste de anchos
            const style = document.createElement('style');
            style.textContent = 'table.dataTable{table-layout:auto !important;}';
            document.head.appendChild(style);

            const sel = '#tablaEmpresas';
            const table = $.fn.dataTable.isDataTable(sel)
                ? $(sel).DataTable()
                : $(sel).DataTable({
                    pageLength: 10,
                    order: [ [1,'desc'] ],
                    scrollX: true,
                    autoWidth: true,
                    language: { url: 'https://cdn.datatables.net/plug-ins/1.13.4/i18n/es-ES.json' }
                });
            function safeAdjust(){
                try{ const c = table && table.table ? table.table().container() : null; if (c) { table.columns.adjust(); } }catch(e){}
            }
            setTimeout(safeAdjust, 0);
            window.addEventListener('resize', safeAdjust);
        }
        // Confirmación de eliminación con SweetAlert2
        $(document).on('submit', '.js-delete-form', function(e){
            e.preventDefault();
            const form = this;
            Swal.fire({
                title: '¿Eliminar empresa?',
                text: 'Esta acción no se puede deshacer',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'Sí, eliminar',
                cancelButtonText: 'Cancelar'
            }).then((result) => {
                if (result.isConfirmed) {
                    form.submit();
                }
            });
        });
    });
</script>
</body>
</html>
