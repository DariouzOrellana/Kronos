<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:with="title='Error 404 | No encontrado'">
<head th:replace="fragments :: head"></head>
<body class="hold-transition error-page">

<div class="error-page">
  <h2 class="headline text-warning">404</h2>
  <div class="error-content">
    <h3><i class="fas fa-exclamation-triangle text-warning"></i> Página no encontrada.</h3>
    <p>
      La página que buscas no existe, fue movida o el enlace es incorrecto.
      Puedes <a th:href="@{/}">volver al inicio</a> o <a href="javascript:history.back()">regresar</a> a la página anterior.
    </p>
    <p class="mb-0">
      <span class="text-muted">Ruta:</span>
      <code th:text="${path}">/desconocida</code>
    </p>
  </div>
  <!-- /.error-content -->
</div>
<!-- /.error-page -->

<div th:replace="fragments :: scripts"></div>
</body>
</html>
