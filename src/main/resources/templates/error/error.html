<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:with="title='Error | Ocurrió un problema'">
<head th:replace="fragments :: head"></head>
<body class="hold-transition error-page">

<div class="error-page">
  <h2 class="headline text-info" th:text="${status}">Error</h2>
  <div class="error-content">
    <h3>
      <i class="fas fa-exclamation-circle text-info"></i>
      <span th:text="${error}">Ocurrió un problema</span>
    </h3>
    <p th:text="${message}">Ha ocurrido un problema inesperado. Por favor, vuelve a intentarlo en unos minutos.</p>

    <p class="mb-1">
      <span class="text-muted">Ruta:</span>
      <code th:text="${path}">/desconocida</code>
    </p>
    <p class="text-muted" th:if="${timestamp}">
      <span>Fecha:</span>
      <span th:text="${#temporals.format(timestamp, 'yyyy-MM-dd HH:mm:ss')}">-</span>
    </p>

    <div class="mt-3">
      <a class="btn btn-primary" th:href="@{/}"><i class="fas fa-home"></i> Ir al inicio</a>
      <a class="btn btn-secondary" href="javascript:location.reload()"><i class="fas fa-sync"></i> Reintentar</a>
    </div>

    <details class="mt-3" th:if="${trace}">
      <summary>Ver detalles técnicos</summary>
      <pre class="mt-2" style="white-space:pre-wrap;max-height:280px;overflow:auto" th:text="${trace}"></pre>
    </details>
  </div>
</div>

<div th:replace="fragments :: scripts"></div>
</body>
</html>
