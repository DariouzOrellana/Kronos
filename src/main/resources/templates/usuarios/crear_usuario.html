<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments.html :: head}"></head>
<body class="hold-transition sidebar-mini layout-fixed">
<div class="wrapper">
    <div th:replace="~{fragments.html :: menu}"></div>

    <div class="content-wrapper">
        <div class="content-header">
            <div class="container-fluid">
                <div class="row mb-2">
                    <div class="col-sm-6">
                        <h1 class="m-0" th:text="${title}">Crear Usuario</h1>
                    </div>
                </div>
            </div>
        </div>

        <section class="content">
            <div class="container-fluid">
                <div class="row">
                    <div class="col-12">
                        <div class="card">
                            <div class="card-body">
                                <form th:action="@{/usuarios/guardar}" th:object="${usuario}" method="post" id="formUsuario">
                                    <div class="form-row">
                                        <div class="form-group col-md-4">
                                            <label for="username">Usuario</label>
                                            <input type="text" class="form-control" id="username" name="username" th:field="*{username}" required>
                                            <div class="invalid-feedback">Obligatorio.</div>
                                            <div class="invalid-feedback d-block" th:if="${usernameError}" th:text="${usernameError}"></div>
                                        </div>
                                        <div class="form-group col-md-4">
                                            <label for="password">Contraseña</label>
                                            <input type="password" class="form-control" id="password" name="password" th:field="*{password}" required>
                                            <div class="invalid-feedback">Obligatorio.</div>
                                        </div>
                                        <div class="form-group col-md-4">
                                            <label for="rolId">Rol</label>
                                            <select class="form-control select2" id="rolId" name="rolId" required>
                                                <option value="">-- Seleccione --</option>
                                                <option th:each="r : ${roles}" th:value="${r.id}" th:text="${r.nombreRol}"></option>
                                            </select>
                                            <div class="invalid-feedback">Obligatorio.</div>
                                            <div class="invalid-feedback d-block" th:if="${rolError}" th:text="${rolError}"></div>
                                        </div>
                                    </div>
                                    <div class="form-row">
                                        <div class="form-group col-md-4">
                                            <label for="empresaId">Empresa</label>
                                            <select class="form-control select2" id="empresaId" name="empresaId" required>
                                                <option value="">-- Seleccione --</option>
                                                <option th:each="e : ${empresas}" th:value="${e.id}" th:text="${e.nombreEmpresa}"></option>
                                            </select>
                                            <div class="invalid-feedback">Obligatorio.</div>
                                        </div>
                                        <div class="form-group col-md-4">
                                            <label for="sucursalId">Sucursal</label>
                                            <select class="form-control select2" id="sucursalId" name="sucursalId" required>
                                                <option value="">-- Seleccione --</option>
                                            </select>
                                            <div class="invalid-feedback">Obligatorio.</div>
                                        </div>
                                        <div class="form-group col-md-4">
                                            <label for="cajaId">Caja</label>
                                            <select class="form-control select2" id="cajaId" name="cajaId" required>
                                                <option value="">-- Seleccione --</option>
                                            </select>
                                            <div class="invalid-feedback">Obligatorio.</div>
                                            <div class="invalid-feedback d-block" th:if="${cajaError}" th:text="${cajaError}"></div>
                                        </div>
                                    </div>

                                    <div class="d-flex justify-content-between">
                                        <a th:href="@{/usuarios}" class="btn btn-secondary">Cancelar</a>
                                        <button type="submit" class="btn btn-primary">Guardar</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <footer th:replace="~{fragments.html :: footer}"></footer>
</div>
<div th:replace="~{fragments.html :: scripts}"></div>
<script>
    $(function () {

        /* =========================
           Inicializar Select2
        ========================= */
        if ($.fn.select2) {
            $('.select2').select2({ width: '100%' });
        }

        const $form = $('#formUsuario');
        const $username = $('#username');
        const $password = $('#password');
        const $rol = $('#rolId');
        const $empresa = $('#empresaId');
        const $sucursal = $('#sucursalId');
        const $caja = $('#cajaId');

        /* =========================
           Helpers
        ========================= */
        function toggle($el, ok) {
            if (!$el || !$el.length) return;

            let $target = $el;
            if ($el.hasClass('select2-hidden-accessible')) {
                $target = $el.next('.select2-container')
                    .find('.select2-selection');
            }

            $target.removeClass('is-valid is-invalid');
            ok ? $target.addClass('is-valid') : $target.addClass('is-invalid');
        }

        function existsAndValid($el) {
            return !$el || !$el.length || !!$el.val();
        }

        /* =========================
           Validación
        ========================= */
        function validate() {

            const uOk = $.trim($username.val()).length > 0;
            const pOk = $.trim($password.val()).length > 0;

            toggle($username, uOk);
            toggle($password, pOk);

            const rOk = existsAndValid($rol);
            const eOk = existsAndValid($empresa);
            const sOk = existsAndValid($sucursal);
            const cOk = existsAndValid($caja);

            toggle($rol, rOk);
            toggle($empresa, eOk);
            toggle($sucursal, sOk);
            toggle($caja, cOk);

            return uOk && pOk && rOk && eOk && sOk && cOk;
        }

        /* =========================
           Eventos
        ========================= */
        $username.on('input blur', validate);
        $password.on('input blur', validate);

        $rol.on('change', validate);

        $empresa.on('change', function () {

            $sucursal.empty().append(new Option('-- Seleccione --', ''));
            $caja.empty().append(new Option('-- Seleccione --', ''));

            if (!$(this).val()) {
                validate();
                return;
            }

            fetch(`/sucursales/by-empresa/${$(this).val()}`)
                .then(r => r.json())
                .then(data => {
                    $.each(data, function (_, s) {
                        $sucursal.append(new Option(s.nombreSucursal, s.id));
                    });
                    $sucursal.trigger('change.select2');
                    validate();
                })
                .catch(validate);
        });

        $sucursal.on('change', function () {

            $caja.empty().append(new Option('-- Seleccione --', ''));

            if (!$(this).val()) {
                validate();
                return;
            }

            fetch(`/cajas/by-sucursal/${$(this).val()}`)
                .then(r => r.json())
                .then(data => {
                    $.each(data, function (_, c) {
                        $caja.append(new Option(c.descripcion, c.id));
                    });
                    $caja.trigger('change.select2');
                    validate();
                })
                .catch(validate);
        });

        $caja.on('change', validate);

        $form.on('submit', function (e) {
            if (!validate()) {
                e.preventDefault();
                e.stopPropagation();
            }
        });

        /* =========================
           Validación inicial
        ========================= */
        validate();

    });
</script>


</body>
</html>
