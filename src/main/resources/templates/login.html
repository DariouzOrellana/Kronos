<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        body { font-family: Arial, sans-serif; background: #f5f5f7; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 28px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); width: 360px; }
        h1 { margin: 0 0 16px; font-size: 22px; }
        .field { margin-bottom: 14px; }
        label { display: block; margin-bottom: 6px; color: #333; font-weight: 600; }
        input { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
        .btn { width: 100%; padding: 10px 12px; background: #0052cc; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; }
        .btn:hover { background: #003d99; }
        .alert { padding: 10px 12px; border-radius: 8px; margin-bottom: 12px; font-size: 13px; }
        .alert-error { background: #ffe6e6; color: #a10000; }
        .alert-info { background: #e6f0ff; color: #003d99; }
        .helper { color: #666; font-size: 12px; margin-top: 8px; }
    </style>
</head>
<body>
<div class="card">
    <h1>Iniciar sesión</h1>

    <div th:if="${error}" class="alert alert-error" th:text="${error}">Credenciales inválidas</div>
    <div th:if="${logout}" class="alert alert-info">Sesión cerrada correctamente</div>

    <form th:action="@{/perform_login}" method="post">
        <div class="field">
            <label for="username">Usuario</label>
            <input type="text" id="username" name="username" autocomplete="username" required>
        </div>
        <div class="field">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn">Acceder</button>
        <div class="helper">Si olvidaste tu contraseña, contacta al administrador.</div>
    </form>
</div>
</body>
</html>
