<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments.html :: head}"></head>
<body class="hold-transition sidebar-mini layout-fixed">
<div class="wrapper">
    <div th:replace="~{fragments.html :: menu}"></div>

    <div class="content-wrapper">
        <div class="content-header">
            <div class="container-fluid">
                <div class="row mb-2">
                    <div class="col-sm-6">
                        <h1 class="m-0" th:text="${title}">Clientes</h1>
                    </div>
                </div>
            </div>
        </div>

        <section class="content">
            <div class="container-fluid">
                <div class="row">
                    <div class="col-12">
                        <div class="card mb-3">
                            <div class="card-body">
                                <div class="d-flex align-items-center">
                                    <div class="mr-auto"></div>
                                    <div class="mx-auto">
                                        <a th:href="@{/clientes/crear}" class="btn btn-primary">
                                            <i class="fas fa-plus"></i> Nuevo cliente
                                        </a>
                                    </div>
                                    <div class="ml-auto"></div>
                                </div>
                            </div>
                        </div>

                        <div class="card">
                            <div class="card-header d-flex justify-content-between align-items-center">
                                <h3 class="card-title m-0">Listado de clientes</h3>
                            </div>
                            <div class="card-body">
                                <div>
                                    <style>
                                        /* Compact icon buttons and vertical alignment */
                                        .btn-icon { padding: .2rem .35rem; line-height: 1; }
                                        .table td, .table th { vertical-align: middle; }
                                    </style>
                                    <table id="tablaClientes" class="table table-bordered table-striped w-100 nowrap" style="width:100%">
                                        <thead>
                                        <tr>
                                            <th class="col-actions">Acciones</th>
                                            <th class="col-id">ID</th>
                                            <th>Estado</th>
                                            <th>Nombre</th>
                                            <th>DUI</th>
                                            <th>NRC</th>
                                            <th>NIT</th>
                                            <th>Correo</th>
                                            <th>Teléfono</th>
                                        </tr>
                                        </thead>
                                        <tbody>
                                        <tr th:each="c : ${clientes}">
                                            <td class="col-actions">
                                                <button type="button" class="btn btn-default dropdown-toggle btn-sm" data-toggle="dropdown" aria-expanded="false">
                                                    <i class="fas fa-th"></i>
                                                </button>
                                                <div class="dropdown-menu p-2">
                                                    <div class="d-flex flex-wrap align-items-center">
                                                        <a th:href="@{'/clientes/' + ${c.id} + '/editar'}" class="btn btn-primary btn-icon" title="Editar" aria-label="Editar"><i class="fas fa-edit"></i></a>
                                                        <form th:action="@{'/clientes/' + ${c.id} + '/eliminar'}" method="post" class="js-delete-form d-inline-block ml-1">
                                                            <button type="submit" class="btn btn-danger btn-icon" title="Eliminar" aria-label="Eliminar">
                                                                <i class="fas fa-trash"></i>
                                                            </button>
                                                        </form>
                                                    </div>
                                                </div>


                                            </td>
                                            <td class="col-id" th:text="${c.id}"></td>
                                            <td class="text-center">
                                                <span th:class="${c.estado} == 1 ? 'badge badge-success' : 'badge badge-secondary'"
                                                      th:text="${c.estado} == 1 ? 'Activo' : 'Inactivo'"></span>
                                            </td>
                                            <td th:text="${c.nombreCliente}"></td>
                                            <td th:text="${c.dui}"></td>
                                            <td th:text="${c.noRegistro}"></td>
                                            <td th:text="${c.nit}"></td>
                                            <td th:text="${c.correo}"></td>
                                            <td th:text="${c.telefono}"></td>
                                        </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </section>
    </div>

    <footer th:replace="~{fragments.html :: footer}"></footer>
</div>
<div th:replace="~{fragments.html :: scripts}"></div>
<script>
    document.addEventListener('DOMContentLoaded', function(){
        if (window.jQuery && $('#tablaClientes').length) {
            const style = document.createElement('style');
            style.textContent = 'table.dataTable{table-layout:auto !important;}';
            document.head.appendChild(style);

            const sel = '#tablaClientes';
            const table = $.fn.dataTable.isDataTable(sel)
                ? $(sel).DataTable()
                : $(sel).DataTable({
                    pageLength: 10,
                    order: [ [1,'desc'] ],
                    scrollX: true,
                    autoWidth: true,
                    language: { url: 'https://cdn.datatables.net/plug-ins/1.13.4/i18n/es-ES.json' }
                });
            setTimeout(function(){ try{ table.columns.adjust(); }catch(e){} }, 0);
            window.addEventListener('resize', function(){ try{ table.columns.adjust(); }catch(e){} });
        }
        // Confirmación de eliminación con SweetAlert2
        $(document).on('submit', '.js-delete-form', function(e){
            e.preventDefault();
            const form = this;
            Swal.fire({
                title: '¿Eliminar cliente?',
                text: 'Esta acción no se puede deshacer',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'Sí, eliminar',
                cancelButtonText: 'Cancelar'
            }).then((result) => {
                if (result.isConfirmed) {
                    form.submit();
                }
            });
        });
    });
</script>
</body>
</html>
