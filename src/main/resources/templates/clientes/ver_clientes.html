<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments.html :: head}"></head>
<body class="hold-transition sidebar-mini layout-fixed">
<div class="wrapper">
    <div th:replace="~{fragments.html :: menu}"></div>

    <div class="content-wrapper">
        <div class="content-header">
            <div class="container-fluid">
                <div class="row mb-2">
                    <div class="col-sm-6">
                        <h1 class="m-0" th:text="${title}">Clientes</h1>
                    </div>
                </div>
            </div>
        </div>

        <section class="content">
            <div class="container-fluid">
                <div class="row">
                    <div class="col-12">
                        <div class="card mb-3">
                            <div class="card-body">
                                <div class="d-flex align-items-center">
                                    <div class="mr-auto"></div>
                                    <div class="mx-auto">
                                        <a th:href="@{/clientes/crear}" class="btn btn-primary">
                                            <i class="fas fa-plus"></i> Nuevo cliente
                                        </a>
                                    </div>
                                    <div class="ml-auto"></div>
                                </div>
                            </div>
                        </div>

                        <div class="card">
                            <div class="card-header d-flex justify-content-between align-items-center">
                                <h3 class="card-title m-0">Listado de clientes</h3>
                            </div>
                            <div class="card-body">
                                <div>
                                    <table id="tablaClientes" class="table table-bordered table-striped w-100 nowrap" style="width:100%">
                                        <thead>
                                        <tr>
                                            <th>Acciones</th>
                                            <th>ID</th>
                                            <th>Nombre</th>
                                            <th>NIT</th>
                                            <th>DUI</th>
                                            <th>Correo</th>
                                            <th>Teléfono</th>
                                            <th>Estado</th>
                                        </tr>
                                        </thead>
                                        <tbody>
                                        <tr th:each="c : ${clientes}">
                                            <td class="text-nowrap">
                                                <a th:href="@{'/clientes/' + ${c.id}}" class="btn btn-sm btn-secondary" title="Ver"><i class="fas fa-eye"></i></a>
                                                <a th:href="@{'/clientes/' + ${c.id} + '/editar'}" class="btn btn-sm btn-primary" title="Editar"><i class="fas fa-edit"></i></a>
                                                <form th:action="@{'/clientes/' + ${c.id} + '/eliminar'}" method="post" style="display:inline" class="js-delete-form">
                                                    <button type="submit" class="btn btn-sm btn-danger" title="Eliminar">
                                                        <i class="fas fa-trash"></i>
                                                    </button>
                                                </form>
                                            </td>
                                            <td th:text="${c.id}"></td>
                                            <td th:text="${c.nombreCliente}"></td>
                                            <td th:text="${c.nit}"></td>
                                            <td th:text="${c.dui}"></td>
                                            <td th:text="${c.correo}"></td>
                                            <td th:text="${c.telefono}"></td>
                                            <td th:text="${c.estado}"></td>
                                        </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </section>
    </div>

    <footer th:replace="~{fragments.html :: footer}"></footer>
</div>
<div th:replace="~{fragments.html :: scripts}"></div>
<script>
    document.addEventListener('DOMContentLoaded', function(){
        if (window.jQuery && $('#tablaClientes').length) {
            const style = document.createElement('style');
            style.textContent = 'table.dataTable{table-layout:auto !important;}';
            document.head.appendChild(style);

            const sel = '#tablaClientes';
            const table = $.fn.dataTable.isDataTable(sel)
                ? $(sel).DataTable()
                : $(sel).DataTable({
                    pageLength: 10,
                    order: [ [1,'desc'] ],
                    scrollX: true,
                    autoWidth: true,
                    language: { url: 'https://cdn.datatables.net/plug-ins/1.13.4/i18n/es-ES.json' }
                });
            setTimeout(function(){ try{ table.columns.adjust(); }catch(e){} }, 0);
            window.addEventListener('resize', function(){ try{ table.columns.adjust(); }catch(e){} });
        }
        // Confirmación de eliminación con SweetAlert2
        $(document).on('submit', '.js-delete-form', function(e){
            e.preventDefault();
            const form = this;
            Swal.fire({
                title: '¿Eliminar cliente?',
                text: 'Esta acción no se puede deshacer',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'Sí, eliminar',
                cancelButtonText: 'Cancelar'
            }).then((result) => {
                if (result.isConfirmed) {
                    form.submit();
                }
            });
        });
    });
</script>
</body>
</html>
